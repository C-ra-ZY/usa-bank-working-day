name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Use npm@11.6.1 (packageManager)
        run: |
          set -euo pipefail
          npm i -g npm@11.6.1
          npm --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install, test, build, and run package gates
        env:
          NPM_CONFIG_YES: "true"
        run: |
          set -euo pipefail

          bun install
          bun test
          bun run build
          npm run check:package
